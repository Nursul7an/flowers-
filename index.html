<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#2B1B2F">
  <title>Для Дарии 🌸</title>
  <meta name="description" content="Эти цветы — для тебя.">

  <!-- Open Graph превью для Telegram / WhatsApp.
       После деплоя замените относительные пути на абсолютные (https://<домен>/assets/og.jpg) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Для Дарии 🌸">
  <meta property="og:description" content="Одна вершина, один закат и цветы — для тебя 🌸">
  <meta property="og:image" content="assets/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Букет розовых пионов на фоне Фудзиямы на закате">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Marck+Script&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script>
    document.documentElement.classList.add('js');
    // safety net: if the scripts never start, show the static version
    setTimeout(function () {
      if (!(window.Flowers && window.Flowers.debug)) document.documentElement.classList.add('fallback');
    }, 6000);
  </script>
</head>
<body>
  <main id="stage">
    <div id="world" aria-hidden="true"></div>
    <div class="dim" aria-hidden="true"></div>
    <div class="bouquet-light" aria-hidden="true"></div>
    <div id="bouquet-wrap" aria-hidden="true"></div>
    <canvas id="sky" aria-hidden="true"></canvas>

    <div id="alti" aria-hidden="true"><span class="alti-ico">⛰</span><span class="alti-val">0</span><span class="alti-unit">м</span></div>

    <section id="congrats" aria-live="polite">
      <p class="c-title">Вершина покорена!</p>
      <p class="c-alt">3 776 м · Фудзияма</p>
      <p class="c-sub">Поздравляю, Дария! 🎉</p>
    </section>

    <section id="intro">
      <div class="intro-text">
        <p class="lead">Каждая вершина тебе по силам.</p>
        <p class="dedication">А эти цветы — для тебя,</p>
        <p class="name"><span class="name-glow" aria-hidden="true">Дария</span><span class="name-text">Дария</span><span class="name-shine" aria-hidden="true">Дария</span></p>
      </div>
    </section>

    <noscript>
      <img class="static-bouquet" src="assets/bouquet.svg" alt="Букет розовых пионов">
    </noscript>

    <footer id="finale">
      <button id="replay" class="ghost" type="button">↻ ещё раз</button>
    </footer>

    <button id="sound" class="sound" type="button" aria-label="Включить музыку" aria-pressed="false">🔇</button>
    <div class="veil" aria-hidden="true"></div>
  </main>

  <script src="js/vendor/gsap.min.js"></script>
  <script src="js/world.js"></script>
  <script src="js/peony.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/music.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
